name: SMC OB + MACD Scanner

on:

  workflow_dispatch:
    inputs:

      slot:
        description: "Slot manual, contoh 09:00"
        required: false
        type: string

  schedule:

    # 09:05 WIB
    - cron: "5 2 * * 1-5"

    # 10:05 WIB
    - cron: "5 3 * * 1-5"

    # 11:05 WIB
    - cron: "5 4 * * 1-5"

    # 13:05 WIB
    - cron: "5 6 * * 1-5"

    # 14:05 WIB
    - cron: "5 7 * * 1-5"

    # 15:05 WIB
    - cron: "5 8 * * 1-5"

    # 16:05 WIB
    - cron: "5 9 * * 1-5"

    # 17:05 WIB
    - cron: "5 10 * * 1-5"


permissions:
  contents: write


jobs:

  scan:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy tqdm


      # =====================================================
      # TENTUKAN SLOT
      # =====================================================

      - name: Determine slot
        id: slot
        shell: bash
        run: |

          # MANUAL RUN
          if [ -n "${{ inputs.slot }}" ]; then

            echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"

            exit 0

          fi


          # AUTOMATIC RUN
          case "${{ github.event.schedule }}" in

            "5 2 * * 1-5")
              echo "slot=09:00" >> "$GITHUB_OUTPUT"
              ;;

            "5 3 * * 1-5")
              echo "slot=10:00" >> "$GITHUB_OUTPUT"
              ;;

            "5 4 * * 1-5")
              echo "slot=11:00" >> "$GITHUB_OUTPUT"
              ;;

            "5 6 * * 1-5")
              echo "slot=13:00" >> "$GITHUB_OUTPUT"
              ;;

            "5 7 * * 1-5")
              echo "slot=14:00" >> "$GITHUB_OUTPUT"
              ;;

            "5 8 * * 1-5")
              echo "slot=15:00" >> "$GITHUB_OUTPUT"
              ;;

            "5 9 * * 1-5")
              echo "slot=16:00" >> "$GITHUB_OUTPUT"
              ;;

            "5 10 * * 1-5")
              echo "slot=17:00" >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo "slot=" >> "$GITHUB_OUTPUT"
              ;;

          esac


      # =====================================================
      # SMC OB
      # =====================================================

      - name: Run SMC OB
        id: ob
        continue-on-error: true
        run: |

          python scanner.py


      # =====================================================
      # MACD
      # =====================================================

      - name: Run MACD
        id: macd
        continue-on-error: true
        run: |

          python scanner_macd.py


      # =====================================================
      # ARCHIVE
      # =====================================================

      - name: Archive history
        run: |

          python archive_history.py \
            --ob "${{ steps.ob.outcome }}" \
            --macd "${{ steps.macd.outcome }}" \
            --schedule "${{ github.event.schedule }}" \
            --slot "${{ steps.slot.outputs.slot }}"


      # =====================================================
      # COMMIT
      # =====================================================

      - name: Commit scanner data
        if: always()
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            results.json \
            macd_results.json \
            history.json \
            scan_status.json


          if git diff --cached --quiet; then

            echo "Tidak ada perubahan."

          else

            git commit -m "update scanner results"

            git push

          fi
