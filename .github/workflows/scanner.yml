name: SMC OB Scanner

on:

  workflow_dispatch:

  schedule:
    - cron: "30 2 * * 1-5"


permissions:
  contents: write


jobs:

  scan:

    runs-on: ubuntu-latest


    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ==========================================
      # PYTHON
      # ==========================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ==========================================
      # INSTALL
      # ==========================================

      - name: Install dependencies

        run: |

          pip install -r requirements.txt


      # ==========================================
      # STATUS RUNNING
      # ==========================================

      - name: Set scanner status RUNNING

        run: |

          python - <<'PY'

          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Asia/Jakarta")

          data = {

              "status": "running",

              "started_at":
                  datetime.now(tz).strftime(
                      "%Y-%m-%d %H:%M:%S"
                  ),

              "finished_at": null
          }

          with open(
              "scan_status.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          PY


      # ==========================================
      # SAVE RUNNING STATUS
      # ==========================================

      - name: Commit RUNNING status

        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add scan_status.json

          git diff --cached --quiet || \
            git commit -m "Scanner started"

          git push


      # ==========================================
      # RUN SCANNER
      # ==========================================

      - name: Run scanner

        run: |

          python scanner.py


      # ==========================================
      # SAVE RESULTS
      # ==========================================

      - name: Save results

        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            results.json \
            scan_status.json

          git diff --cached --quiet || \
            git commit -m "Update scanner results"

          git push
