name: SMC OB Scanner

on:

  workflow_dispatch:

  schedule:

    - cron: "30 2 * * 1-5"


permissions:

  contents: write


concurrency:

  group: smc-ob-scanner

  cancel-in-progress: false


jobs:

  scan:

    runs-on: ubuntu-latest

    timeout-minutes: 10


    steps:

      # =================================================
      # CHECKOUT
      # =================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0


      # =================================================
      # PYTHON
      # =================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # =================================================
      # INSTALL
      # =================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install yfinance pandas numpy


      # =================================================
      # STATUS RUNNING
      # =================================================

      - name: Set scanner status RUNNING

        run: |

          python - <<'PY'

          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          TZ = ZoneInfo("Asia/Jakarta")

          now = datetime.now(TZ).strftime(
              "%Y-%m-%d %H:%M:%S"
          )

          try:

              with open(
                  "scan_status.json",
                  "r",
                  encoding="utf-8"
              ) as f:

                  old = json.load(f)

          except Exception:

              old = {}

          data = {

              "status": "running",

              "started_at": now,

              "finished_at":
                  old.get("finished_at"),

              "duration_seconds":
                  None,

              "duration_text":
                  None,

              "total_tickers":
                  old.get("total_tickers", 0),

              "processed":
                  0,

              "errors":
                  0,

              "candidates":
                  0

          }

          with open(
              "scan_status.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          PY


      # =================================================
      # COMMIT RUNNING STATUS
      # =================================================

      - name: Commit RUNNING status

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add scan_status.json

          git diff --cached --quiet || git commit -m "scanner running"

          git push


      # =================================================
      # RUN SCANNER
      # =================================================

      - name: Run scanner

        id: scanner

        continue-on-error: true

        run: |

          python scanner.py


      # =================================================
      # SET FINAL STATUS
      # =================================================

      - name: Set final scanner status

        run: |

          python - <<'PY'

          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          TZ = ZoneInfo("Asia/Jakarta")

          now = datetime.now(TZ).strftime(
              "%Y-%m-%d %H:%M:%S"
          )

          try:

              with open(
                  "scan_status.json",
                  "r",
                  encoding="utf-8"
              ) as f:

                  data = json.load(f)

          except Exception:

              data = {}

          scanner_outcome = "${{ steps.scanner.outcome }}"

          if scanner_outcome == "success":

              data["status"] = "success"

          else:

              data["status"] = "failed"

          data["finished_at"] = now

          with open(
              "scan_status.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          PY


      # =================================================
      # COMMIT RESULT
      # =================================================

      - name: Commit scanner results

        if: always()

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results.json scan_status.json

          git diff --cached --quiet || git commit -m "update scanner results"

          git push


      # =================================================
      # FAIL JOB IF SCANNER FAILED
      # =================================================

      - name: Fail workflow if scanner failed

        if: steps.scanner.outcome == 'failure'

        run: |

          echo "Scanner gagal."

          exit 1
