name: SMC OB Scanner

on:

  workflow_dispatch:

  schedule:
    # 09:30 WIB = 02:30 UTC
    # Senin-Jumat
    - cron: "30 2 * * 1-5"


# ==========================================================
# PERMISSIONS
# ==========================================================

permissions:
  contents: write


# ==========================================================
# CONCURRENCY
# ==========================================================

concurrency:

  group: smc-ob-scanner

  cancel-in-progress: false


jobs:

  scan:

    runs-on: ubuntu-latest

    timeout-minutes: 10


    steps:

      # ====================================================
      # 1. CHECKOUT
      # ====================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0


      # ====================================================
      # 2. PYTHON
      # ====================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ====================================================
      # 3. INSTALL
      # ====================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install \
            yfinance \
            pandas \
            numpy


      # ====================================================
      # 4. STATUS RUNNING
      # ====================================================

      - name: Set scan status RUNNING

        run: |

          python - <<'PY'

          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(
              ZoneInfo("Asia/Jakarta")
          ).strftime(
              "%Y-%m-%d %H:%M:%S"
          )

          data = {

              "status": "running",

              "started_at": now,

              "finished_at": None

          }

          with open(
              "scan_status.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  data,
                  f,
                  indent=2
              )

          PY


      # ====================================================
      # 5. COMMIT RUNNING
      # ====================================================

      - name: Commit RUNNING status

        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add scan_status.json

          if git diff --cached --quiet; then

            echo "Status RUNNING tidak berubah."

          else

            git commit -m "scanner: running"

            git push

          fi


      # ====================================================
      # 6. JALANKAN SCANNER
      # ====================================================

      - name: Run SMC OB Scanner

        run: |

          python scanner.py


      # ====================================================
      # 7. STATUS SUCCESS
      # ====================================================

      - name: Set scan status SUCCESS

        if: success()

        run: |

          python - <<'PY'

          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(
              ZoneInfo("Asia/Jakarta")
          ).strftime(
              "%Y-%m-%d %H:%M:%S"
          )

          data = {

              "status": "success",

              "finished_at": now

          }

          with open(
              "scan_status.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  data,
                  f,
                  indent=2
              )

          PY


      # ====================================================
      # 8. STATUS FAILED
      # ====================================================

      - name: Set scan status FAILED

        if: failure()

        run: |

          python - <<'PY'

          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(
              ZoneInfo("Asia/Jakarta")
          ).strftime(
              "%Y-%m-%d %H:%M:%S"
          )

          data = {

              "status": "failed",

              "finished_at": now

          }

          with open(
              "scan_status.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  data,
                  f,
                  indent=2
              )

          PY


      # ====================================================
      # 9. SIMPAN SEMUA HASIL
      # ====================================================

      - name: Commit scan results

        if: always()

        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then

            echo "Tidak ada perubahan untuk disimpan."

          else

            git commit -m "scanner: update results"

            git push

          fi
